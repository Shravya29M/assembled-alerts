[project]
name = "assembled-alerts"
version = "0.1.0"
description = "Configurable intraday alerts for contact-center team leads (take-home)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
